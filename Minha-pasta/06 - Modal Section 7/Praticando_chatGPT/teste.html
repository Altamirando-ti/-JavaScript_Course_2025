<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Modal para praticar JavaScript</title>
  <link rel="stylesheet" href="teste.css" />
</head>

<body>

  <!-- Botão que futuramente abrirá o modal via JS -->
  <button id="openModalBtn">Abrir Modal</button>

  <!-- Overlay do modal -->
  <div class="modal-overlay" id="modalOverlay">

    <div class="modal">
      <!-- Botão que futuramente fechará o modal -->
      <button class="close-btn" id="closeModalBtn">✖</button>

      <h2>Janela Modal</h2>
      <p>Esta janela modal está pronta para você controlar com JavaScript.</p>
    </div>

  </div>

</body>
<script src="teste.js"></script>
</html>
